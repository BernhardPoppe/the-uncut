<!doctype html>
<html lang="de">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Uncut – We Have Moved</title>
	<link href="/graphics/icons/favicon.ico" rel="shortcut icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
	
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		html,
		body.moved {
			height: 100%;
			margin: 0;
		}

		body.moved {
			background: #fff;
			overflow: hidden;
		}

		body.moved #cookie-banner {
			display: none !important;
		}

		/* Adminbar-Bump-Fallback */
		html:has(body.moved) {
			margin-top: 0 !important;
		}

		body.moved #wpadminbar {
			display: none !important;
		}

		.moved {
			--cs-space: clamp(1rem, 2.5vw, 2.5rem);
			position: relative;
			display: grid;
			grid-template-columns: 1fr 1fr;
			width: 100vw;
			height: 100dvh;
			margin: 0;
			padding: 0;
		}

		/* Reißverschluss auf der Trennlinie */
		.moved__zipper {
			/* --zip-w = Bildschirmbreite der Zähne (Original 74px); alles andere leitet sich davon ab */
			--zip-w: clamp(18px, 2vw, 26px);
			position: absolute;
			grid-column: 1 / -1;
			grid-row: 1 / -1;
			top: 0;
			bottom: 0;
			left: 50%;
			width: calc(var(--zip-w) * 117 / 74);
			transform: translateX(-50%);
			z-index: 3;
			pointer-events: none;
			background-image: url("/graphics/coming-soon/zipper.png");
			background-repeat: repeat-y;
			background-position: center top;
			background-size: var(--zip-w) auto;
		}

		.moved__zipper img {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			display: block;
			height: auto;
		}

		.moved__zipper .moved__zipper-head {
			top: 0;
			width: calc(var(--zip-w) * 117 / 74);
		}

		.moved__zipper .moved__zipper-end {
			bottom: 0;
			width: calc(var(--zip-w) * 71 / 74);
		}

		.moved__left,
		.moved__right {
			display: grid;
			grid-template-rows: 1fr auto;
			gap: var(--cs-space);
			min-width: 0;
			min-height: 0;
			height: 100%;
			background: #fff;
			color: #7b7b72;
			padding: var(--cs-space);
		}

		.moved__left .moved__headline-wrap {
			display: flex;
			align-items: flex-start;
			min-height: 0;
			overflow: hidden;
		}

		.moved__right .moved__headline-wrap {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			justify-content: flex-end;
			min-height: 0;
			overflow: hidden;
		}

		.moved__headline {
			font-family: "Poppins", sans-serif;
			font-size: 48px;
			font-weight: 700;
			line-height: 0.95;
			letter-spacing: -0.02em;
			text-transform: uppercase;
			color: #7b7b72;
			margin: 0;
			padding: 0;
			hyphens: none;
			white-space: nowrap;
		}

		.moved__headline span {
			display: block;
		}

		.moved__contact,
		.moved__url-wrap {
			margin: 0;
			padding-bottom: var(--cs-space);
		}

		.moved__contact {
			font-family: "Poppins", sans-serif;
			font-weight: 700;
			font-size: 0.9rem;
			line-height: 1.45;
		}

		.moved__contact p,
		.moved__url-wrap p {
			margin: 0;
		}

		.moved__contact a,
		.moved__url {
			color: inherit;
			text-decoration: none;
		}

		.moved__url {
			display: block;
			margin: 0;
			font-family: "Poppins", sans-serif;
			font-weight: 400;
			font-size: 1.25rem;
			line-height: 1.1;
			letter-spacing: -0.02em;
			text-transform: none;
			white-space: nowrap;
		}

		.moved__contact a:hover,
		.moved__contact a:focus-visible,
		.moved__url:hover,
		.moved__url:focus-visible {
			text-decoration: underline;
		}

		@media (max-width: 780px) {
			body.moved {
				overflow: auto;
			}

			.moved {
				grid-template-columns: 1fr;
				grid-template-rows: 1fr 1fr;
				gap: calc(var(--cs-space) * 2);
				height: 100dvh;
				min-height: 100dvh;
			}

			.moved__zipper {
				top: calc(50% + var(--cs-space));
				bottom: auto;
				left: 50%;
				height: 100vw;
				width: calc(var(--zip-w) * 117 / 74);
				transform: translate(-50%, -50%) rotate(90deg);
				transform-origin: center center;
			}
		}
	</style>
</head>

<body class="moved">
	<main class="moved">
		<div class="moved__left">
			<div class="moved__headline-wrap">
				<h1 class="moved__headline">
					<span>We Have</span>
					<span>Moved</span>
				</h1>
			</div>
			<footer class="moved__contact">
				<p>contact: <a href="mailto:hello@the-uncut.com">hello@the-uncut.com</a></p>
				<p>instagram: <a href="https://www.instagram.com/theuncut.agency/" target="_blank" rel="noopener noreferrer">@theuncut.agency</a></p>
			</footer>
		</div>
		<div class="moved__right">
			<div class="moved__headline-wrap">
				<p class="moved__headline">
					<span>Find Us</span>
					<span>Over At</span>
				</p>
			</div>
			<footer class="moved__url-wrap">
				<p><a class="moved__url" href="https://www.the-uncut.com">www.the-uncut.com</a></p>
			</footer>
		</div>
		<div class="moved__zipper" aria-hidden="true">
			<img class="moved__zipper-end" src="/graphics/coming-soon/zipper-end.png" alt="" decoding="async">
			<img class="moved__zipper-head" src="/graphics/coming-soon/zipper-head.png" alt="" decoding="async">
		</div>
	</main>
	<script>
		(function () {
			function measureFit(wrap, headline) {
				var column = wrap.closest('.moved__left, .moved__right');
				var gap = column ? parseFloat(getComputedStyle(column).gap) || 0 : 0;
				var maxHeight = Math.max(wrap.clientHeight - gap, 24);
				var maxWidth = wrap.clientWidth;
				var low = 8;
				var high = 800;
				var best = low;

				while (low <= high) {
					var mid = Math.floor((low + high) / 2);
					headline.style.fontSize = mid + 'px';

					var overflows =
						headline.scrollWidth > maxWidth ||
						headline.scrollHeight > maxHeight;

					if (!overflows) {
						best = mid;
						low = mid + 1;
					} else {
						high = mid - 1;
					}
				}

				return best;
			}

			function fitUrl(url, maxWidth, headlineSize) {
				if (!url) return;
				var low = 8;
				var high = Math.max(8, Math.round(headlineSize * 0.32));
				var best = low;

				while (low <= high) {
					var mid = Math.floor((low + high) / 2);
					url.style.fontSize = mid + 'px';

					if (url.scrollWidth <= maxWidth) {
						best = mid;
						low = mid + 1;
					} else {
						high = mid - 1;
					}
				}

				url.style.fontSize = best + 'px';
			}

			function fitAll() {
				var leftWrap = document.querySelector('.moved__left .moved__headline-wrap');
				var rightWrap = document.querySelector('.moved__right .moved__headline-wrap');
				var leftHeadline = leftWrap && leftWrap.querySelector('.moved__headline');
				var rightHeadline = rightWrap && rightWrap.querySelector('.moved__headline');
				var urlWrap = document.querySelector('.moved__url-wrap');
				var url = urlWrap && urlWrap.querySelector('.moved__url');

				if (!leftWrap || !rightWrap || !leftHeadline || !rightHeadline) return;

				leftHeadline.style.fontSize = '';
				rightHeadline.style.fontSize = '';
				if (url) url.style.fontSize = '';

				var size = Math.min(
					measureFit(leftWrap, leftHeadline),
					measureFit(rightWrap, rightHeadline)
				);

				leftHeadline.style.fontSize = size + 'px';
				rightHeadline.style.fontSize = size + 'px';
				fitUrl(url, (urlWrap || rightWrap).clientWidth, size);
			}

			function init() {
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(fitAll);
				} else {
					fitAll();
				}
			}

			init();

			if ('ResizeObserver' in window) {
				document.querySelectorAll('.moved__headline-wrap').forEach(function (wrap) {
					new ResizeObserver(fitAll).observe(wrap);
				});
			}

			window.addEventListener('resize', fitAll);
		})();
	</script>
	
</body>

</html>
